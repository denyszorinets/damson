{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "damson.fullname" . }}-controller
  labels:
    {{- include "damson.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "damson.controllerSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Controllers reach each other on the internal port: plain HTTP, authenticated
    # by the cluster secret, so only controller pods may connect.
    - from:
        - podSelector:
            matchLabels:
              {{- include "damson.controllerSelector" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.controller.internalPort }}}
    # The API and the agent sockets.
    - ports:
        - {protocol: TCP, port: 8080}
      {{- with .Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
