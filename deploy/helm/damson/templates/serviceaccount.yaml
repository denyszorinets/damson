{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "damson.serviceAccountName" . }}
  labels:
    {{- include "damson.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod decides: only OpenBao Kubernetes auth needs the token.
automountServiceAccountToken: false
{{- end }}
{{- if .Values.agents.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "damson.agentServiceAccountName" . }}
  labels:
    {{- include "damson.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.agents.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
