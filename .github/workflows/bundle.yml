name: Bundle

# Builds the offline bundle (deploy/bundle/build.sh) and checks it: the archive
# and every file in it match their checksums, and the binary runs. On demand the
# bundle also holds the three container images.
on:
  workflow_dispatch:
    inputs:
      with_images:
        description: Include the container images
        type: boolean
        default: false
  pull_request:
    paths:
      - "deploy/bundle/**"
      - "deploy/systemd/**"
      - ".github/workflows/bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HELM_VERSION: 3.16.4
      HELM_SHA256: fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
      WITH_IMAGES: ${{ inputs.with_images && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install helm
        run: |
          curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/helm.tgz -C /usr/local/bin --strip-components=1 linux-amd64/helm
      - run: make web
      - run: make bundle
      - name: Verify the archive and its contents
        run: |
          cd dist
          sha256sum -c ./*.sha256
          mkdir unpacked
          tar -xzf damson-bundle-*.tar.gz -C unpacked
          cd unpacked/damson-bundle-*
          ./verify.sh
          ./bin/damson-linux-amd64 version
          test -f chart/damson-*.tgz
          test -f systemd/damson-controller.service
