name: Pages

# Builds the website: the landing page (site/) at the root and the Sphinx
# documentation under /docs/. Pull requests build it as a check; pushes to main
# (releases) and manual runs publish it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "ARCHITECTURE.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      - run: make docs
      - name: Assemble
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r docs/_build/html _site/docs
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/docs/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
