# golangci-lint v2 configuration. Run with `make lint` (also part of `make check`).
version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - revive
  settings:
    errcheck:
      # Writes to stdout/stderr/ResponseWriter cannot be usefully handled.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
      # "cancelled" is the wire value of pluginsdk.KindCancelled (public API).
      ignore-rules:
        - cancelled
    revive:
      # Minimal set: correctness-oriented rules only, no stylistic noise.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    paths:
      - web/node_modules
      - web/build

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - web/node_modules
